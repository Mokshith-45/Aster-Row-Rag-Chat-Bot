<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aster & Row Support</title>
  <style>
    :root { color-scheme: light; --ink: #18231f; --muted: #68736d; --paper: #f5f3ed; --panel: #fffefa; --line: #d9ddd6; --accent: #1b6a56; --accent-dark: #124b3d; --warm: #d9794c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 10% 0%, #e4eee5 0, transparent 35%), var(--paper); color: var(--ink); font: 16px/1.5 Georgia, "Times New Roman", serif; }
    .shell { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 56px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .kicker { color: var(--warm); font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 1.8px; text-transform: uppercase; }
    h1 { margin: 6px 0 0; font-size: clamp(32px, 6vw, 58px); line-height: .98; font-weight: 500; letter-spacing: 0; }
    .intro { max-width: 320px; margin: 0; color: var(--muted); font: 14px/1.45 Arial, sans-serif; }
    .chat { overflow: hidden; border: 1px solid var(--line); background: var(--panel); box-shadow: 0 18px 50px rgba(24, 35, 31, .08); }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); background: #edf3ed; font: 13px Arial, sans-serif; }
    .status { color: var(--accent); font-weight: 700; }
    #messages { min-height: 390px; max-height: 58vh; overflow-y: auto; padding: 24px; }
    .message { max-width: 78%; margin: 0 0 18px; padding: 14px 16px; white-space: pre-wrap; }
    .message.user { margin-left: auto; background: var(--accent); color: white; }
    .message.assistant { border-left: 3px solid var(--warm); background: #f7f4ec; }
    .empty { color: var(--muted); text-align: center; padding: 100px 20px; font-size: 19px; }
    form { display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--line); background: #fbfaf5; }
    textarea { flex: 1; min-height: 54px; resize: vertical; border: 1px solid var(--line); padding: 12px; color: var(--ink); background: white; font: 16px Georgia, serif; }
    button { align-self: stretch; border: 0; padding: 0 22px; cursor: pointer; background: var(--accent); color: white; font: 700 14px Arial, sans-serif; }
    button:hover { background: var(--accent-dark); }
    .meta { display: flex; gap: 14px; align-items: center; padding: 0 16px 16px; color: var(--muted); font: 12px Arial, sans-serif; }
    .meta label { display: flex; gap: 6px; align-items: center; }
    .sources { margin-top: 12px; color: var(--muted); font: 12px/1.4 Arial, sans-serif; }
    .handoff { margin-top: 10px; color: #9b4d29; font: 700 12px Arial, sans-serif; }
    @media (max-width: 640px) { .shell { width: min(100% - 20px, 960px); padding-top: 24px; } header { display: block; } .intro { margin-top: 12px; } #messages { min-height: 320px; padding: 16px; } .message { max-width: 92%; } form { display: block; } button { width: 100%; min-height: 46px; margin-top: 10px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="kicker">Aster & Row</div><h1>Support, with receipts.</h1></div>
      <p class="intro">Ask about policies, products, or an order. The assistant keeps this conversation separate from every other session.</p>
    </header>
    <section class="chat" aria-label="Support chat">
      <div class="bar"><strong>Customer support</strong><span class="status" id="status">Ready</span></div>
      <div id="messages"><div class="empty" id="empty">What can we help you find?</div></div>
      <div class="meta"><span id="session-label"></span><label><input id="debug" type="checkbox"> Show trace</label><button id="new-session" type="button">New conversation</button></div>
      <form id="chat-form"><textarea id="message" aria-label="Your question" placeholder="Ask a question..." required></textarea><button type="submit">Send</button></form>
    </section>
  </main>
  <script>
    const sessionKey = "aster-row-session";
    let sessionId = localStorage.getItem(sessionKey) || crypto.randomUUID();
    localStorage.setItem(sessionKey, sessionId);
    const messages = document.getElementById("messages");
    const empty = document.getElementById("empty");
    const status = document.getElementById("status");
    document.getElementById("session-label").textContent = "Session " + sessionId.slice(0, 8);
    function addMessage(role, text, response) {
      if (empty) empty.remove();
      const item = document.createElement("div");
      item.className = "message " + role;
      item.textContent = text;
      if (response) {
        if (response.sources?.length) {
          const sources = document.createElement("div"); sources.className = "sources";
          sources.textContent = "Sources: " + response.sources.map(s => s.filename + " - " + s.heading).join("; "); item.appendChild(sources);
        }
        if (response.handoff) { const handoff = document.createElement("div"); handoff.className = "handoff"; handoff.textContent = "Human support recommended"; item.appendChild(handoff); }
        if (response.trace && Object.keys(response.trace).length) { const trace = document.createElement("div"); trace.className = "sources"; trace.textContent = "Trace route: " + response.trace.route; item.appendChild(trace); }
      }
      messages.appendChild(item); messages.scrollTop = messages.scrollHeight;
    }
    document.getElementById("new-session").addEventListener("click", () => { sessionId = crypto.randomUUID(); localStorage.setItem(sessionKey, sessionId); location.reload(); });
    document.getElementById("chat-form").addEventListener("submit", async (event) => {
      event.preventDefault(); const input = document.getElementById("message"); const text = input.value.trim(); if (!text) return;
      addMessage("user", text); input.value = ""; status.textContent = "Thinking...";
      try {
        const response = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: sessionId, message: text, debug: document.getElementById("debug").checked }) });
        if (!response.ok) throw new Error("Request failed");
        const data = await response.json(); addMessage("assistant", data.answer, data); status.textContent = "Ready";
      } catch (error) { addMessage("assistant", "The service could not process that request. Please try again."); status.textContent = "Unavailable"; }
    });
  </script>
</body>
</html>
